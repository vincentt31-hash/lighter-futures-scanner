name: Python backend tests

on:
  push:
    paths:
      - "binance_futures_signal_scanner_v1/**"
      - ".github/workflows/python-backend-tests.yml"
  pull_request:
    paths:
      - "binance_futures_signal_scanner_v1/**"
      - ".github/workflows/python-backend-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r binance_futures_signal_scanner_v1/requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s binance_futures_signal_scanner_v1/tests -v
      - name: Compile backend modules
        run: python -m compileall -q binance_futures_signal_scanner_v1
